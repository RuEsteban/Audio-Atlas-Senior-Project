<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>AudioAtlas</title>
	<style>@import url('https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Oleo+Script+Swash+Caps:wght@400;700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&family=Shrikhand&display=swap');</style>
</head>
<body>
	<h1>Audio Atlas</h1>

	<div id="musicPlayer" class="player">
		<div class="songInfo">
			<strong id="songName"></strong>
			<p id="artistName"></p>
			<p id="albumName"></p>
			<p id="year"></p>
		</div>

		<div class="centerColumn">
			<div class="controls">
				<button>◀◀</button>
				<div class="playButton">
					<button>▶</button>
				</div>
				<button>▶▶</button>
			</div>
			<div class="timeline">
				<span class="currentTime">0:00</span>
				<div class="barContainer">
					<div class="timelineBar"></div>
				</div>
				<span class="fullTime">1:00</span>
			</div>
		</div>

		<div class="extraDetails">
			<div class="detailsLeft">
				<p>Plays:</p>
				<p>Likes:</p>
			</div>
			<div class="detailsRight">
				<p>#</p>
				<p>#</p>
			</div>
		</div>
	</div>

	<div id="options" class="optionContainer">
		<p>Options</p>
		<form>
			<label class="radio">
				<input type="radio" name="database" value="Database 1">
				<span class="custom-radio"></span>
				Database 1
			</label>

			<label class="radio">
				<input type="radio" name="database" value="Database 2">
				<span class="custom-radio"></span>
				Database 2
			</label>

			<label class="radio">
				<input type="radio" name="database" value="Database 3">
				<span class="custom-radio"></span>
				Database 3
			</label>
		</form>
	</div>

	<div id="searchBar">
  		<input type="text" id="countryInput" placeholder="Search for a country..." />
  		<ul id="suggestions"></ul>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>

	<div id="topSongs" class="info">
		<div class="header">
			<h1><span id="countryName">Country</span></h1>
			<p>Week of:</p>
			<button id="closeTopSongs" class="exit-button">x</button>
		</div>

		<div class="custom-dropdown">
			<div class="selected">Feb 1, 2026</div>
			<ul class="options">
				<li data-value="2026-02-01">Feb 1, 2026</li>
				<li data-value="2026-02-08">Feb 8, 2026</li>
				<li data-value="2026-02-15">Feb 15, 2026</li>
			</ul>
		</div>

		<div id="songList" class="songList">
			<ul>
				<li>
					<div class="song-number">1</div>
					<img src="album1.jpg" alt="Album 1" onerror="this.onerror=null; this.src='/img/default-album.png';">
					<div class="song-info">
						<span class="title">Song 1</span>
						<span class="artist">Artist A</span>
						<span class="album-name">Album A</span>
						<span class="year">2024</span>
					</div>
				</li>
				<li>
					<div class="song-number">2</div>
					<img src="album2.jpg" alt="Album 2" onerror="this.onerror=null; this.src='/img/default-album.png';">
					<div class="song-info">
						<span class="title">Song 2</span>
						<span class="artist">Artist B</span>
						<span class="album-name">Album B</span>
						<span class="year">2025</span>
					</div>
				</li>
			</ul>
		</div>
	</div>

	<div id="container">
		<div id="globe"></div>
	</div>

	<script type="module" src="/src/main.js"></script>
</body>
</html>
